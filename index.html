<!DOCTYPE html>
<html lang="zh-Hant" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>有向數大師挑戰賽</title>
<!-- Tailwind CSS via CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Font Awesome for Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Google Fonts for Esports Feel -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/***** Custom Styles & Animations *****/
body {
    font-family: 'Noto Sans TC', sans-serif;
    background: radial-gradient(circle, #1a2a45, #111827, #000000);
    color: #e5e7eb;
    overflow: hidden;
}
.font-orbitron { font-family: 'Orbitron', sans-serif; }
.btn-gold {
    background-image: linear-gradient(to right, #FBBF24 0%, #F59E0B 51%, #FBBF24 100%);
    transition: 0.5s;
    background-size: 200% auto;
    color: #1e293b;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
    border: 2px solid #FBBF24;
}
.btn-gold:hover { background-position: right center; }
.btn-gold:disabled {
    background-image: none;
    background-color: #4b5563;
    color: #9ca3af;
    border-color: #374151;
    cursor: not-allowed;
}
.btn-slate {
    background-image: linear-gradient(to right, #475569 0%, #334155 51%, #475569 100%);
    transition: 0.5s;
    background-size: 200% auto;
    color: white;
    border: 2px solid #64748b;
}
.btn-slate:hover { background-position: right center; }
.btn-slate:disabled {
    background: #1e293b;
    color: #475569;
    border-color: #334155;
    cursor: not-allowed;
}
.view { display: none; }
.view.active { display: block; }
.pulse { animation: pulse-animation 2s infinite; }
@keyframes pulse-animation {
    0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); }
    100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
}
.stamp {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(3) rotate(-15deg);
    opacity: 0;
    transition: all 0.3s ease-out;
    border: 8px solid;
    padding: 1rem 2rem;
    border-radius: 0.5rem;
    font-size: 3rem;
    font-weight: 900;
    font-family: 'Orbitron', sans-serif;
    text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
}
.stamp.show {
    transform: translate(-50%, -50%) scale(1) rotate(-15deg);
    opacity: 1;
}
.stamp-correct { color: #22c55e; border-color: #22c55e; }
.stamp-wrong { color: #ef4444; border-color: #ef4444; }
.numpad-btn {
    background: rgba(30, 41, 59, 0.9);
    backdrop-filter: blur(5px);
    border: 2px solid #475569;
    transition: all 0.2s;
    border-radius: 8px;
}
.numpad-btn:hover { background: #64748b; color: #fff; }
.numpad-btn:active { transform: scale(0.95); }
.error-message { color: #ef4444; font-weight: bold; display: none; margin-top: 0.5rem; }

/* Yellow / Red Cards CSS */
.yellow-card {
    position: absolute;
    top: -20px; right: 10px;
    width: 40px; height: 60px;
    background-color: #fbbf24;
    border: 3px solid #b45309;
    border-radius: 4px;
    transform: rotate(15deg);
    box-shadow: 2px 4px 10px rgba(0,0,0,0.5);
    display: none;
    align-items: center; justify-content: center;
    color: #000; font-weight: 900; font-size: 0.8rem;
    z-index: 5;
    animation: popIn 0.5s ease-out;
}
.red-card-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(127, 29, 29, 0.85);
    backdrop-filter: blur(4px);
    flex-direction: column;
    align-items: center; justify-content: center;
    border-radius: 0.5rem;
    z-index: 10;
}
.red-card {
    width: 100px; height: 150px;
    background-color: #ef4444;
    border: 4px solid #7f1d1d;
    border-radius: 8px;
    transform: rotate(-10deg);
    box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: dropIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn { 0% { transform: scale(0) rotate(0); } 100% { transform: scale(1) rotate(15deg); } }
@keyframes dropIn { 0% { transform: translateY(-100px) rotate(0); opacity: 0; } 100% { transform: translateY(0) rotate(-10deg); opacity: 1; } }
@keyframes crown-bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
</style>
</head>
<body class="w-screen h-screen flex items-center justify-center">
<div id="app-container" class="w-full h-full max-w-4xl mx-auto p-4 flex flex-col items-center justify-center">
<!-- 1. ROLE SELECTION VIEW -->
<div id="view-role-selection" class="view active w-full text-center">
    <h1 class="text-5xl md:text-6xl font-bold font-orbitron text-yellow-400 mb-2 tracking-widest text-shadow">有向數大師挑戰賽</h1>
    <p class="text-slate-300 mb-12 text-lg">Directed Numbers Master Championship</p>
    <div class="flex gap-4 md:gap-8 justify-center">
        <button id="btn-select-host" class="btn-gold text-xl md:text-2xl font-bold py-4 px-8 md:py-6 md:px-12 rounded-lg shadow-lg pulse">我是主持 (Host)</button>
        <button id="btn-select-player" class="btn-slate text-xl md:text-2xl font-bold py-4 px-8 md:py-6 md:px-12 rounded-lg shadow-lg">我是玩家 (Player)</button>
    </div>
</div>

<!-- 2A. HOST SETUP VIEW -->
<div id="view-host-setup" class="view w-full max-w-md">
    <h2 class="text-4xl font-bold font-orbitron text-yellow-400 mb-6 text-center">建立遊戲房間</h2>
    <div class="space-y-4 bg-slate-800/50 p-6 rounded-lg">
        <div>
            <label class="block mb-2 text-md text-slate-300">房間名稱 (Room Name)</label>
            <input id="host-room-name" type="text" class="w-full bg-slate-900 border border-slate-600 rounded-md p-3 text-white focus:ring-2 focus:ring-yellow-400 outline-none" placeholder="e.g., S1A 數學小組">
        </div>
        <div>
            <label class="block mb-2 text-md text-slate-300">房間密碼 (Password - 可選)</label>
            <input id="host-room-password" type="text" class="w-full bg-slate-900 border border-slate-600 rounded-md p-3 text-white focus:ring-2 focus:ring-yellow-400 outline-none" placeholder="e.g., 1234">
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="host-game-mode" class="block mb-2 text-md text-slate-300">比賽模式</label>
                <select id="host-game-mode" class="w-full bg-slate-900 border border-slate-600 rounded-md p-3 text-white focus:ring-2 focus:ring-yellow-400 outline-none">
                    <option value="time">限時模式</option>
                    <option value="score">目標分數模式</option>
                </select>
            </div>
            <div>
                <label for="host-mode-value" class="block mb-2 text-md text-slate-300">模式數值</label>
                <select id="host-mode-value" class="w-full bg-slate-900 border border-slate-600 rounded-md p-3 text-white focus:ring-2 focus:ring-yellow-400 outline-none"></select>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label for="host-game-topic" class="block mb-2 text-md text-slate-300">遊戲項目</label>
                <select id="host-game-topic" class="w-full bg-slate-900 border border-slate-600 rounded-md p-3 text-white focus:ring-2 focus:ring-yellow-400 outline-none">
                    <option value="add_sub">有向數加減</option>
                    <option value="mul_div">有向數乘除</option>
                    <option value="mixed">四則運算</option>
                </select>
            </div>
            <div>
                <label for="host-difficulty" class="block mb-2 text-md text-slate-300">遊戲難度</label>
                <select id="host-difficulty" class="w-full bg-slate-900 border border-slate-600 rounded-md p-3 text-white focus:ring-2 focus:ring-yellow-400 outline-none">
                    <option value="L1">Level 1</option>
                    <option value="L2">Level 2</option>
                </select>
            </div>
        </div>
        <button id="btn-create-room" class="btn-gold w-full font-bold text-lg py-3 rounded-lg mt-4">建立房間</button>
        <button id="btn-host-back" class="btn-slate w-full font-bold text-lg py-3 rounded-lg mt-2">返回</button>
    </div>
</div>

<!-- 2B. PLAYER JOIN VIEW -->
<div id="view-player-join" class="view w-full max-w-md">
    <h2 class="text-4xl font-bold font-orbitron text-yellow-400 mb-6 text-center">加入遊戲房間</h2>
    <div class="space-y-4 bg-slate-800/50 p-6 rounded-lg">
        <div>
            <label class="block mb-2 text-md text-slate-300">房間名稱 (Room Name)</label>
            <input id="player-room-name" type="text" class="w-full bg-slate-900 border border-slate-600 rounded-md p-3 text-white focus:ring-2 focus:ring-yellow-400 outline-none" placeholder="輸入主持提供的房間名稱">
            <p id="player-room-error" class="error-message">你所選擇的房間還未開設，請向主持人查詢。</p>
        </div>
        <div>
            <label class="block mb-2 text-md text-slate-300">房間密碼 (Password - 如有)</label>
            <input id="player-room-password" type="password" class="w-full bg-slate-900 border border-slate-600 rounded-md p-3 text-white focus:ring-2 focus:ring-yellow-400 outline-none">
        </div>
        <div>
            <label class="block mb-2 text-md text-slate-300">玩家名稱 (Your Name)</label>
            <input id="player-name" type="text" class="w-full bg-slate-900 border border-slate-600 rounded-md p-3 text-white focus:ring-2 focus:ring-yellow-400 outline-none" placeholder="必須輸入你的遊戲名稱！">
        </div>
        <button id="btn-join-room" class="btn-gold w-full font-bold text-lg py-3 rounded-lg mt-4">加入房間</button>
        <button id="btn-player-back" class="btn-slate w-full font-bold text-lg py-3 rounded-lg mt-2">返回</button>
    </div>
</div>

<!-- 3. LOBBY VIEW -->
<div id="view-lobby" class="view w-full max-w-4xl">
    <div class="text-center mb-6">
        <h2 class="text-4xl font-bold font-orbitron text-yellow-400">遊戲大廳</h2>
        <p class="text-2xl text-slate-300">房間: <span id="lobby-room-name" class="font-bold"></span></p>
    </div>
    <div id="lobby-player-list" class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8"></div>
    <div id="lobby-player-controls" class="text-center">
        <button id="btn-player-ready" class="btn-gold text-2xl font-bold py-4 px-10 rounded-lg">準備 (Ready)</button>
    </div>
    <div id="lobby-host-controls" class="text-center" style="display: none;">
        <p class="text-slate-400 mb-4">等待所有玩家準備...</p>
        <button id="btn-host-start" class="btn-gold text-2xl font-bold py-4 px-10 rounded-lg pulse" disabled>開始遊戲 (Start Game)</button>
    </div>
</div>

<!-- 4. GAME VIEW -->
<div id="view-game" class="view w-full h-full flex flex-col">
    <!-- Game Header -->
    <div id="game-header" class="hidden flex justify-between items-center p-2 md:p-4 bg-black/30 rounded-t-lg">
        <div id="game-info" class="text-xs md:text-lg">
            <span id="game-topic-display"></span> | <span id="game-difficulty-display"></span>
        </div>
        <div id="game-timer" class="font-orbitron text-4xl md:text-5xl text-yellow-400 tracking-widest">00:00</div>
        <div id="game-score-target" class="text-xs md:text-lg text-right">
            目標分數: <span id="game-score-value" class="font-bold text-xl md:text-2xl text-yellow-400">10</span>
        </div>
    </div>
    <!-- Main Game Area -->
    <div class="flex-grow flex flex-col md:flex-row gap-4 mt-4 min-h-0">
        <!-- Host: Player Scores -->
        <div id="host-game-view" class="w-full md:w-1/4 bg-slate-900/50 p-2 md:p-4 rounded-lg hidden overflow-y-auto">
            <h3 class="text-xl md:text-2xl font-bold text-yellow-400 mb-4 text-center">玩家分數</h3>
            <div id="host-player-scores" class="space-y-2"></div>
        </div>
        
        <!-- Center Panel: Question & Numpad -->
        <div id="game-center-panel" class="flex-grow flex flex-col items-center justify-center bg-slate-900/50 rounded-lg p-4 md:p-6 relative">
            <div id="question-container" class="mb-6 text-center">
                <p id="question-text" class="text-5xl md:text-7xl font-bold font-orbitron tracking-wider text-white"></p>
            </div>
            
            <!-- Player Numpad View -->
            <div id="player-game-view" class="w-full max-w-xs md:max-w-sm hidden relative mt-4">
                <!-- Player Name Display -->
                <div class="text-center mb-2">
                    <span id="player-ingame-name" class="text-2xl md:text-3xl font-black text-yellow-300 tracking-widest uppercase bg-black/50 px-4 py-1 rounded-full shadow-lg border border-yellow-500/50"></span>
                </div>
                <!-- Yellow Card Icon -->
                <div id="yellow-card" class="yellow-card">警告</div>
                
                <div id="player-answer-display" class="w-full h-16 md:h-20 bg-slate-800 rounded-t-lg border-2 border-b-0 border-slate-500 text-white text-4xl md:text-5xl text-right p-3 font-orbitron shadow-inner"></div>
                <div class="grid grid-cols-4 gap-2 bg-slate-800 p-2 border-2 border-t-0 border-slate-500 rounded-b-lg shadow-lg relative">
                    <button class="numpad-btn text-2xl p-4 font-bold" data-key="7">7</button>
                    <button class="numpad-btn text-2xl p-4 font-bold" data-key="8">8</button>
                    <button class="numpad-btn text-2xl p-4 font-bold" data-key="9">9</button>
                    <button class="numpad-btn text-2xl p-4 font-bold text-yellow-400" data-key="+">＋</button>
                    <button class="numpad-btn text-2xl p-4 font-bold" data-key="4">4</button>
                    <button class="numpad-btn text-2xl p-4 font-bold" data-key="5">5</button>
                    <button class="numpad-btn text-2xl p-4 font-bold" data-key="6">6</button>
                    <button class="numpad-btn text-2xl p-4 font-bold text-yellow-400" data-key="-">－</button>
                    <button class="numpad-btn text-2xl p-4 font-bold" data-key="1">1</button>
                    <button class="numpad-btn text-2xl p-4 font-bold" data-key="2">2</button>
                    <button class="numpad-btn text-2xl p-4 font-bold" data-key="3">3</button>
                    <button class="numpad-btn text-2xl p-4 font-bold text-red-400" data-key="C">C</button>
                    <button class="numpad-btn text-2xl p-4 font-bold col-span-4" data-key="0">0</button>
                    
                    <!-- Red Card Penalty Overlay -->
                    <div id="red-card-overlay" class="red-card-overlay">
                        <div class="red-card mb-4">
                            <i class="fas fa-hand-paper text-4xl text-white mb-2"></i>
                            <span class="text-white text-3xl font-black">OUT</span>
                        </div>
                        <p class="text-2xl font-bold text-white text-center shadow-black drop-shadow-md">連續答錯兩題<br><span class="text-yellow-400">暫停一回合</span></p>
                    </div>
                </div>
                <button id="btn-submit-answer" class="btn-gold w-full text-2xl font-black py-4 mt-4 rounded-lg pulse tracking-widest shadow-xl">提交答案</button>
            </div>
            
            <!-- Host Status View -->
            <div id="host-control-view" class="text-center hidden w-full">
                <p id="host-status-text" class="text-2xl md:text-3xl font-bold text-slate-300 mb-4 animate-pulse">等待玩家搶答...</p>
            </div>
        </div>
    </div>
    
    <!-- Result Modal -->
    <div id="result-modal" style="display: none;" class="absolute inset-0 bg-black/90 flex flex-col items-center justify-center z-40 p-4 backdrop-blur-sm">
        <div id="result-stamp" class="stamp"></div>
        <div class="text-center bg-slate-900 border border-slate-700 p-8 rounded-2xl shadow-2xl w-full max-w-3xl">
            <p class="mb-2 text-slate-400 text-lg">搶答玩家: <span id="result-submitter" class="font-bold text-yellow-400 text-2xl"></span></p>
            <p class="mb-4 text-3xl md:text-4xl">提交答案: <span id="result-submitted-answer" class="font-orbitron font-bold"></span></p>
            <hr class="border-slate-700 my-6">
            <p class="mb-2 text-2xl text-green-400 font-bold">正確答案</p>
            <p id="result-correct-answer" class="text-5xl md:text-6xl font-orbitron font-black text-green-300 mb-8 tracking-wider"></p>
            <div class="bg-slate-800 p-6 rounded-lg text-left inline-block w-full">
                <p class="mb-3 text-xl text-yellow-400 font-bold border-b border-slate-600 pb-2"><i class="fas fa-list-ol mr-2"></i>解題步驟</p>
                <div id="result-steps" class="text-xl md:text-2xl font-mono text-slate-200 leading-relaxed space-y-2"></div>
            </div>
            <button id="btn-next-question" class="btn-slate text-2xl font-bold py-4 px-12 rounded-lg mt-8 shadow-lg hover:text-yellow-400 transition-colors" style="display: none;">下一題 <i class="fas fa-arrow-right ml-2"></i></button>
        </div>
    </div>
    
    <!-- Winner Modal -->
    <div id="winner-modal" style="display: none;" class="absolute inset-0 bg-black/95 flex flex-col items-center justify-center z-50">
        <i class="fas fa-trophy text-8xl text-yellow-400 mb-6 drop-shadow-[0_0_15px_rgba(251,191,36,0.8)]" style="animation: crown-bounce 1s ease-in-out infinite;"></i>
        <p class="text-6xl font-orbitron font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 mb-10 tracking-widest">GAME OVER</p>
        <div id="final-scores" class="bg-slate-900 border border-yellow-600/30 p-8 rounded-2xl shadow-[0_0_30px_rgba(251,191,36,0.15)] min-w-[300px]">
            <!-- Top 3 scores injected here -->
        </div>
        <button onclick="window.location.reload()" class="mt-10 btn-slate py-3 px-8 text-xl rounded-lg font-bold hover:text-white">離開房間</button>
    </div>
</div>
</div>

    submit: new Audio('https://cdn.pixabay.com/audio/2021/08/04/audio_12b0c34b17.mp3'),
    correct: new Audio('https://cdn.pixabay.com/audio/2021/08/04/audio_0625c1539c.mp3'), // Punchy correct
    wrong: new Audio('https://cdn.pixabay.com/audio/2022/03/15/audio_731c5123a7.mp3'),   // Error buzz
    win: new Audio('https://cdn.pixabay.com/audio/2022/11/21/audio_a141b12bce.mp3'),
    bgm: new Audio('https://cdn.pixabay.com/audio/2022/01/18/audio_d0a13f69d2.mp3') // Intense BGM
};
sfx.bgm.loop = true;
sfx.bgm.volume = 0.3;

function playSfx(sound) {
    if (sfx[sound]) {
        sfx[sound].currentTime = 0;
        sfx[sound].play().catch(e => console.log("SFX Blocked:", e));
    }
}

function navigateTo(viewId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    localState.currentView = viewId;
}

// --- Detailed Question Generator ---
const getRand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const getNZRand = (min, max) => { let v=0; while(v===0) v=getRand(min,max); return v; };
const fmtS = (n, showPlus=true) => n < 0 ? `(${n})` : (showPlus ? `(+${n})` : `${n}`);

function generateQuestion(topic, difficulty) {
    let question = '', answer = 0, stepsArr = [];
    let n1, n2, n3, op1, op2;

    if (topic === 'add_sub') {
        if (difficulty === 'L1') {
            n1 = getRand(-30, 30); n2 = getRand(-30, 30);
            op1 = Math.random() > 0.5 ? '+' : '-';
            question = `${fmtS(n1)} ${op1} ${fmtS(n2)}`;
            answer = op1 === '+' ? n1 + n2 : n1 - n2;
            stepsArr.push(`${question}`);
            stepsArr.push(`= ${n1} ${op1 === '+' ? (n2>=0?'+':'-') : (n2>=0?'-':'+')} ${Math.abs(n2)}`);
            stepsArr.push(`= ${answer}`);
        } else { // L2
            n1 = getRand(-40, 40); n2 = getRand(-40, 40); n3 = getRand(-40, 40);
            op1 = Math.random() > 0.5 ? '+' : '-'; op2 = Math.random() > 0.5 ? '+' : '-';
            question = `${fmtS(n1)} ${op1} ${fmtS(n2)} ${op2} ${fmtS(n3)}`;
            let temp = op1 === '+' ? n1 + n2 : n1 - n2;
            answer = op2 === '+' ? temp + n3 : temp - n3;
            stepsArr.push(`${question}`);
            let s1 = op1 === '+' ? (n2>=0?'+':'-') : (n2>=0?'-':'+');
            let s2 = op2 === '+' ? (n3>=0?'+':'-') : (n3>=0?'-':'+');
            stepsArr.push(`= ${n1} ${s1} ${Math.abs(n2)} ${s2} ${Math.abs(n3)}`);
            stepsArr.push(`= ${temp} ${s2} ${Math.abs(n3)}`);
            stepsArr.push(`= ${answer}`);
        }
    } else if (topic === 'mul_div') {
        if (difficulty === 'L1') {
            n1 = getNZRand(-20, 20); n2 = getNZRand(-15, 15);
            if (Math.random() > 0.5) { // Mul
                question = `${fmtS(n1)} × ${fmtS(n2)}`;
                answer = n1 * n2;
            } else { // Div
                answer = n1;
                let prod = n1 * n2;
                question = `${fmtS(prod, false)} ÷ ${fmtS(n2)}`;
            }
            stepsArr.push(`${question}`);
            stepsArr.push(`= ${answer}`);
        } else { // L2
            n1 = getNZRand(-12, 12); n2 = getNZRand(-12, 12); n3 = getNZRand(-10, 10);
            if (Math.random() > 0.5) { // A x B ÷ C (ensure exact division)
                let prod = n1 * n2 * n3;
                question = `${fmtS(prod, false)} ÷ ${fmtS(n2)} ÷ ${fmtS(n3)}`;
                answer = n1;
                stepsArr.push(`${question}`);
                stepsArr.push(`= ${prod / n2} ÷ ${fmtS(n3)}`);
                stepsArr.push(`= ${answer}`);
            } else { // A ÷ B × C
                let start = n1 * n2;
                question = `${fmtS(start, false)} ÷ ${fmtS(n1)} × ${fmtS(n3)}`;
                answer = n2 * n3;
                stepsArr.push(`${question}`);
                stepsArr.push(`= ${n2} × ${fmtS(n3)}`);
                stepsArr.push(`= ${answer}`);
            }
        }
    } else if (topic === 'mixed') {
        if (difficulty === 'L1') {
            n1 = getRand(-20, 20); n2 = getNZRand(-10, 10); n3 = getNZRand(-10, 10);
            op1 = Math.random() > 0.5 ? '+' : '-';
            question = `${fmtS(n1, false)} ${op1} ${fmtS(n2)} × ${fmtS(n3)}`;
            let mulRes = n2 * n3;
            answer = op1 === '+' ? n1 + mulRes : n1 - mulRes;
            stepsArr.push(`${question}`);
            stepsArr.push(`= ${n1} ${op1} (${mulRes})`);
            stepsArr.push(`= ${answer}`);
        } else { // L2
            n1 = getNZRand(-12, 12); n2 = getNZRand(-12, 12); 
            n3 = getNZRand(-10, 10); let n4 = getNZRand(-10, 10);
            op1 = Math.random() > 0.5 ? '+' : '-';
            question = `${fmtS(n1)}${fmtS(n2)} ${op1} ${fmtS(n3)}${fmtS(n4)}`;
            let p1 = n1 * n2, p2 = n3 * n4;
            answer = op1 === '+' ? p1 + p2 : p1 - p2;
            stepsArr.push(`${question}`);
            stepsArr.push(`= (${p1}) ${op1} (${p2})`);
            stepsArr.push(`= ${answer}`);
        }
    }
    return { questionText: question, correctAnswer: answer, steps: stepsArr.join('<br>') };
}

function addEventListeners() {
    DOMElements.btnSelectHost.addEventListener('click', () => { playSfx('click'); localState.role = 'host'; navigateTo('view-host-setup'); });
    DOMElements.btnSelectPlayer.addEventListener('click', () => { playSfx('click'); localState.role = 'player'; navigateTo('view-player-join'); });
    DOMElements.btnHostBack.addEventListener('click', () => { playSfx('click'); navigateTo('view-role-selection'); });
    DOMElements.btnPlayerBack.addEventListener('click', () => { playSfx('click'); navigateTo('view-role-selection'); });
    DOMElements.btnCreateRoom.addEventListener('click', handleCreateRoom);
    DOMElements.btnJoinRoom.addEventListener('click', handleJoinRoom);
    DOMElements.btnPlayerReady.addEventListener('click', handlePlayerReady);
    DOMElements.btnHostStart.addEventListener('click', handleHostStartGame);
    DOMElements.numpadButtons.forEach(btn => btn.addEventListener('click', handleNumpadClick));
    DOMElements.btnSubmitAnswer.addEventListener('click', handleSubmitAnswer);
    DOMElements.btnNextQuestion.addEventListener('click', handleNextQuestion);
    DOMElements.hostGameMode.addEventListener('change', updateHostModeOptions);
}

async function handleCreateRoom() {
    playSfx('click');
    const roomName = DOMElements.hostRoomName.value.trim();
    if (!roomName) { alert('請輸入房間名稱'); return; }
    const roomRef = ref(db, 'rooms/' + roomName);
    const snapshot = await get(roomRef);
    if (snapshot.exists() && !confirm('該房間已存在。要覆蓋它嗎？')) return;
    localState.roomName = roomName;
    localState.playerName = 'HOST';
    await set(roomRef, {
        roomName, password: DOMElements.hostRoomPassword.value.trim(), status: 'waiting',
        settings: {
            mode: DOMElements.hostGameMode.value, modeValue: parseInt(DOMElements.hostModeValue.value),
            topic: DOMElements.hostGameTopic.value, difficulty: DOMElements.hostDifficulty.value,
        },
        players: { [localState.playerId]: { name: 'HOST', score: 0, isReady: true, isHost: true } },
        timerState: { paused: true, lastTimeLeft: null, gameStartTime: null, totalPauseDuration: 0 } 
    });
    onDisconnect(roomRef).remove();
    joinLobby(roomName);
}

async function handleJoinRoom() {
    playSfx('click');
    DOMElements.playerRoomError.style.display = 'none';
    const roomName = DOMElements.playerRoomName.value.trim();
    const playerName = DOMElements.playerName.value.trim();
    if (!playerName || !roomName) { alert('請填寫完整資料！'); return; }
    const roomRef = ref(db, 'rooms/' + roomName);
    const snapshot = await get(roomRef);
    if (!snapshot.exists()) { DOMElements.playerRoomError.style.display = 'block'; return; }
    const roomData = snapshot.val();
    if (roomData.password && roomData.password !== DOMElements.playerRoomPassword.value.trim()) { alert('密碼錯誤！'); return; }
    if (roomData.status !== 'waiting') { alert('遊戲已開始，無法加入！'); return; }
    
    localState.roomName = roomName;
    localState.playerName = playerName;
    // REQ 2: 所有玩家底分為 2 分
    const playerRef = ref(db, `rooms/${roomName}/players/${localState.playerId}`);
    await set(playerRef, { name: playerName, score: 2, isReady: false, wrongCount: 0, skipRound: false });
    onDisconnect(playerRef).remove();
    joinLobby(roomName);
}

function joinLobby(roomName) {
    navigateTo('view-lobby');
    DOMElements.lobbyRoomName.textContent = roomName;
    DOMElements.lobbyPlayerControls.style.display = localState.role === 'host' ? 'none' : 'block';
    DOMElements.lobbyHostControls.style.display = localState.role === 'host' ? 'block' : 'none';
    if (localState.roomUnsubscribe) localState.roomUnsubscribe();
    localState.roomUnsubscribe = onValue(ref(db, 'rooms/' + roomName), (snapshot) => {
        const roomData = snapshot.val();
        if (!roomData) return window.location.reload();
        updateLobbyPlayerList(roomData.players);
        if (localState.role === 'host') {
            const players = Object.values(roomData.players || {}).filter(p => !p.isHost);
            DOMElements.btnHostStart.disabled = !(players.length > 0 && players.every(p => p.isReady));
        }
        if (roomData.status === 'playing' && localState.currentView !== 'view-game') {
            localState.roomUnsubscribe();
            startGame(roomData);
        }
    });
}

function updateLobbyPlayerList(players) {
    DOMElements.lobbyPlayerList.innerHTML = '';
    Object.values(players || {}).filter(p => !p.isHost).forEach(p => {
        const card = document.createElement('div');
        card.className = `p-3 rounded-lg text-center shadow-lg ${p.isReady ? 'bg-green-800/80 border-2 border-green-400' : 'bg-slate-700/80'}`;
        card.innerHTML = `<p class="text-lg font-bold truncate">${p.name}</p><p class="text-sm font-bold ${p.isReady ? 'text-green-300' : 'text-slate-400'}">${p.isReady ? '已準備' : '等待中...'}</p>`;
        DOMElements.lobbyPlayerList.appendChild(card);
    });
}

function handlePlayerReady() {
    playSfx('click');
    localState.isReady = !localState.isReady;
    DOMElements.btnPlayerReady.textContent = localState.isReady ? '取消準備' : '準備 (Ready)';
    DOMElements.btnPlayerReady.classList.toggle('btn-gold');
    DOMElements.btnPlayerReady.classList.toggle('btn-slate');
    set(ref(db, `rooms/${localState.roomName}/players/${localState.playerId}/isReady`), localState.isReady);
}

async function handleHostStartGame() {
    playSfx('submit');
    await update(ref(db, `rooms/${localState.roomName}`), { status: 'playing', "timerState/gameStartTime": serverTimestamp(), "timerState/paused": false });
}

function startGame(initialRoomData) {
    navigateTo('view-game');
    sfx.bgm.play().catch(e => console.log("BGM blocked:", e));
    setupGameUI(initialRoomData.settings);
    if (localState.role === 'host' && !initialRoomData.current_question) hostGenerateNewQuestion(initialRoomData.settings);
    
    if (localState.gameUnsubscribe) localState.gameUnsubscribe();
    localState.gameUnsubscribe = onValue(ref(db, 'rooms/' + localState.roomName), (snapshot) => {
        const roomData = snapshot.val();
        if (!roomData || roomData.status === 'finished') { 
            if (localState.gameTimerInterval) clearInterval(localState.gameTimerInterval);
            sfx.bgm.pause();
            if(roomData) showWinner(roomData);
            return; 
        }
        updatePlayerScores(roomData.players);
        updateTimer(roomData);
        const qData = roomData.current_question;
        if (qData && qData.questionText && DOMElements.questionText.textContent !== qData.questionText) {
            DOMElements.questionText.textContent = qData.questionText;
        }
        if (qData && qData.submitted_by) handleAnswerSubmitted(roomData);
        else resetForNewQuestion(roomData);
        
        if (localState.role === 'host' && roomData.settings.mode === 'score') {
            const winner = Object.values(roomData.players).find(p => !p.isHost && p.score >= roomData.settings.modeValue);
            if (winner) update(ref(db, `rooms/${localState.roomName}`), { status: 'finished' });
        }
    });
}

function setupGameUI(settings) {
    DOMElements.gameHeader.classList.remove('hidden');
    const isHost = localState.role === 'host';
    DOMElements.hostGameView.style.display = isHost ? 'block' : 'none';
    DOMElements.hostControlView.style.display = isHost ? 'block' : 'none';
    DOMElements.playerGameView.style.display = isHost ? 'none' : 'block';
    
    if (settings.mode === 'score') {
        DOMElements.gameTimer.style.display = 'none';
        DOMElements.gameScoreTarget.style.display = 'block';
        DOMElements.gameScoreValue.textContent = settings.modeValue;
    } else { 
        DOMElements.gameScoreTarget.style.display = 'none';
        DOMElements.gameTimer.style.display = 'block';
    }
}

function hostGenerateNewQuestion(settings) {
    set(ref(db, `rooms/${localState.roomName}/current_question`), generateQuestion(settings.topic, settings.difficulty));
}

function updatePlayerScores(players) {
    if (localState.role !== 'host' || !DOMElements.hostPlayerScores) return;
    DOMElements.hostPlayerScores.innerHTML = '';
    Object.values(players||{}).filter(p => !p.isHost).sort((a,b) => b.score - a.score).forEach(p => {
        let cards = p.skipRound ? '🟥' : (p.wrongCount === 1 ? '🟨' : '');
        DOMElements.hostPlayerScores.innerHTML += `
            <div class="flex justify-between items-center bg-slate-800 p-3 rounded-md mb-2 border border-slate-700">
                <span class="font-bold text-lg">${p.name}</span>
                <div class="flex items-center gap-2"><span class="text-xl drop-shadow-md">${cards}</span><span class="font-orbitron text-2xl text-yellow-400 font-bold">${p.score}</span></div>
            </div>`;
    });
}

function updateTimer(roomData) {
    if (roomData.settings.mode !== 'time' || !roomData.timerState) return;
    if (localState.gameTimerInterval) clearInterval(localState.gameTimerInterval);
    const ts = roomData.timerState;
    const updateD = (tl) => {
        const m = Math.floor((tl / 1000 / 60) % 60), s = Math.floor((tl / 1000) % 60);
        DOMElements.gameTimer.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    };
    if (ts.paused) return updateD(ts.lastTimeLeft || roomData.settings.modeValue * 1000);
    if (!ts.gameStartTime) return;
    localState.gameTimerInterval = setInterval(() => {
        const tl = Math.max(0, roomData.settings.modeValue * 1000 - (Date.now() - ts.gameStartTime - (ts.totalPauseDuration || 0)));
        localState.lastTimeLeft = tl;
        updateD(tl);
        if (tl <= 0) {
            clearInterval(localState.gameTimerInterval);
            if (localState.role === 'host') update(ref(db, `rooms/${localState.roomName}`), { status: 'finished' });
        }
    }, 500);
}

async function handleAnswerSubmitted(roomData) {
    DOMElements.btnSubmitAnswer.disabled = true;
    DOMElements.btnSubmitAnswer.classList.remove('pulse');
    const q = roomData.current_question, sub = roomData.players[q.submitted_by];
    
    if (localState.role === 'host' && typeof q.is_correct === 'undefined') {
        const isCorrect = parseInt(q.submitted_answer) === q.correctAnswer;
        // REQ 2: 計分系統 (L1: ±1, L2: ±2)
        const diffPts = roomData.settings.difficulty === 'L1' ? 1 : 2;
        const newScore = sub.score + (isCorrect ? diffPts : -diffPts);
        const newWrong = isCorrect ? 0 : (sub.wrongCount || 0) + 1;
        const shouldSkip = newWrong >= 2;
        
        let up = {};
        up[`/current_question/is_correct`] = isCorrect;
        up[`/players/${q.submitted_by}/score`] = newScore;
        up[`/players/${q.submitted_by}/wrongCount`] = shouldSkip ? 0 : newWrong;
        up[`/players/${q.submitted_by}/skipRound`] = shouldSkip;
        if (roomData.settings.mode === 'time') {
            up[`/timerState/paused`] = true; up[`/timerState/lastTimeLeft`] = localState.lastTimeLeft; up[`/timerState/pauseStartTime`] = serverTimestamp();
        }
        await update(ref(db, `rooms/${localState.roomName}`), up);
    } else if (typeof q.is_correct !== 'undefined') {
        if (DOMElements.resultModal.style.display === 'none') {
            DOMElements.resultModal.style.display = 'flex';
            DOMElements.resultSubmitter.textContent = sub.name;
            DOMElements.resultSubmittedAnswer.textContent = q.submitted_answer;
            DOMElements.resultCorrectAnswer.textContent = q.correctAnswer;
            DOMElements.resultSteps.innerHTML = q.steps;
            DOMElements.btnNextQuestion.style.display = localState.role === 'host' ? 'inline-block' : 'none';
            const stamp = DOMElements.resultStamp;
            if (!stamp.classList.contains('show')) {
                playSfx(q.is_correct ? 'correct' : 'wrong');
                stamp.textContent = q.is_correct ? 'CORRECT' : 'WRONG';
                stamp.className = `stamp ${q.is_correct ? 'stamp-correct' : 'stamp-wrong'}`;
                setTimeout(() => stamp.classList.add('show'), 50);
            }
        }
    }
}

function resetForNewQuestion(roomData) {
    DOMElements.resultModal.style.display = 'none';
    DOMElements.resultStamp.classList.remove('show');
    if (localState.role === 'player') {
        const myData = roomData.players[localState.playerId];
        if(myData) {
            // REQ 1: 玩家版面當眼處顯示名稱
            DOMElements.playerInGameName.textContent = myData.name;
            // REQ 2: 紅牌與黃牌邏輯
            DOMElements.yellowCard.style.display = (myData.wrongCount === 1 && !myData.skipRound) ? 'flex' : 'none';
            DOMElements.redCardOverlay.style.display = myData.skipRound ? 'flex' : 'none';
            
            DOMElements.btnSubmitAnswer.disabled = myData.skipRound;
            if(!myData.skipRound) DOMElements.btnSubmitAnswer.classList.add('pulse');
        }
        DOMElements.playerAnswerDisplay.textContent = '';
    } else {
        DOMElements.hostStatusText.textContent = "等待玩家搶答...";
    }
}

async function handleNextQuestion() {
    playSfx('click');
    const roomRef = ref(db, `rooms/${localState.roomName}`);
    const roomData = (await get(roomRef)).val();
    let up = {};
    Object.keys(roomData.players||{}).forEach(id => { if (roomData.players[id].skipRound) up[`/players/${id}/skipRound`] = false; });
    if(roomData.settings.mode === 'time' && roomData.timerState.paused) {
        up["/timerState/paused"] = false; up["/timerState/pauseStartTime"] = null;
        up["/timerState/totalPauseDuration"] = (roomData.timerState.totalPauseDuration||0) + (Date.now() - roomData.timerState.pauseStartTime);
    }
    await update(roomRef, up);
    hostGenerateNewQuestion(roomData.settings);
}

function showWinner(roomData) {
    playSfx('win');
    DOMElements.winnerModal.style.display = 'flex';
    DOMElements.finalScores.innerHTML = '';
    // REQ 5: 顯示頭三甲
    const sorted = Object.values(roomData.players).filter(p => !p.isHost).sort((a,b) => b.score - a.score);
    const ranks = ['🥇 冠軍', '🥈 亞軍', '🥉 季軍'];
    const colors = ['text-yellow-400', 'text-gray-300', 'text-amber-600'];
    
    sorted.slice(0, 3).forEach((p, index) => {
        DOMElements.finalScores.innerHTML += `
            <div class="flex justify-between items-center bg-black/40 p-4 rounded-xl mb-3 w-[350px]">
                <div class="text-2xl font-bold ${colors[index]}">${ranks[index]}<br><span class="text-white text-lg ml-8">${p.name}</span></div>
                <div class="text-4xl font-orbitron font-black text-yellow-300">${p.score}<span class="text-sm ml-1">pts</span></div>
            </div>`;
    });
}

function handleNumpadClick(e) {
    playSfx('click');
    const key = e.currentTarget.dataset.key;
    let ans = DOMElements.playerAnswerDisplay.textContent;
    if (key === 'C') ans = '';
    else if (key === '-' && ans.length === 0) ans = key;
    else if (!isNaN(key)) if (ans.length < 8) ans += key;
    DOMElements.playerAnswerDisplay.textContent = ans;
}

async function handleSubmitAnswer() {
    let ans = DOMElements.playerAnswerDisplay.textContent;
    if (ans === '' || ans === '-') return;
    playSfx('submit');
    DOMElements.btnSubmitAnswer.disabled = true;
    DOMElements.btnSubmitAnswer.classList.remove('pulse');
    const qRef = ref(db, `rooms/${localState.roomName}/current_question`);
    try {
        const res = await runTransaction(qRef, (curr) => {
            if (curr && !curr.submitted_by) { curr.submitted_by = localState.playerId; curr.submitted_answer = ans; return curr; }
            return;
        });
        if (!res.committed) { DOMElements.btnSubmitAnswer.disabled = false; DOMElements.btnSubmitAnswer.classList.add('pulse'); }
    } catch (e) { DOMElements.btnSubmitAnswer.disabled = false; }
}

function updateHostModeOptions(e) {
    DOMElements.hostModeValue.innerHTML = e.target.value === 'time' 
        ? `<option value="180">3分鐘</option><option value="300" selected>5分鐘</option><option value="600">10分鐘</option>`
        : `<option value="10">10分</option><option value="20" selected>20分</option><option value="30">30分</option>`;
}

function init() {
    addEventListeners();
    updateHostModeOptions({ target: DOMElements.hostGameMode });
    navigateTo('view-role-selection');
}
init();
</script>
